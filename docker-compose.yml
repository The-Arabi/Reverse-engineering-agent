version: "3.8"

services:
  # =========================================================================
  # Main application
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: re-lab-app
    restart: unless-stopped
    ports:
      - "5000:5000"   # Web dashboard
      - "8001:8001"   # Ghidra MCP
      - "8002:8002"   # Debugger MCP
      - "9090:9090"   # Prometheus metrics
    environment:
      - REVERSE_ENGINEERING_ENV=production
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-knowledge_base}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONITORING_ENABLED=true
      - PROMETHEUS_ENABLED=true
      - STRUCTURED_LOGGING=false
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - re-lab-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =========================================================================
  # PostgreSQL + pgvector
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: re-lab-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-knowledge_base}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - re-lab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Neo4j (graph database)
  # =========================================================================
  neo4j:
    image: neo4j:5-community
    container_name: re-lab-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
    networks:
      - re-lab-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  # =========================================================================
  # Redis (caching)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: re-lab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - re-lab-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Prometheus (metrics collection)
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: re-lab-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - re-lab-network
    depends_on:
      - app

  # =========================================================================
  # Grafana (dashboards)
  # =========================================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: re-lab-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - re-lab-network
    depends_on:
      - prometheus

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  app-data:
  app-logs:
  postgres-data:
  neo4j-data:
  redis-data:
  prometheus-data:
  grafana-data:

# ===========================================================================
# Networks
# ===========================================================================
networks:
  re-lab-network:
    driver: bridge
